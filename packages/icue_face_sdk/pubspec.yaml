name: icue_face_sdk
description: On-device face detection and MobileFaceNet recognition for Android and Flutter Android apps.
version: 0.2.0
homepage: https://icue.school
resolution: workspace

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: school.icue.icue_face_sdk
        pluginClass: IcueFaceSdkPlugin
