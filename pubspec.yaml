name: icue_monorepo
publish_to: none

environment:
  sdk: ^3.9.0

workspace:
  - apps/icueadmin
  - packages/icue_face_sdk

dev_dependencies:
  flutter_lints: ^6.0.0
  melos: ^8.2.2

melos:
  scripts:
    clean:
      exec: flutter clean
      description: Clean build folders and artifacts across all packages and apps.
    format:
      run: melos exec -- dart format .
      description: Run dart format across all workspace packages.
    format:check:
      exec: dart format --set-exit-if-changed .
      description: Check dart format on all packages and apps in the workspace.
