name: icue_monorepo
publish_to: none

environment:
  sdk: ^3.9.0

workspace:
  - apps/icueadmin
  - packages/icue_face_sdk

dev_dependencies:
  flutter_lints: ^6.0.0
  melos: ^8.2.2

melos:
  scripts:
    clean:
      exec: flutter clean
      description: Clean build folders and artifacts across all packages and apps.
    format:
      exec: >-
        find .
        \( -path '*/.*' -o -path './build' -o -path './ios' -o -path './android' -o -path './windows' -o -path './macos' -o -path './linux' \) -prune
        -o -name "*.dart"
        ! -name "*.g.dart"
        ! -name "*.freezed.dart"
        ! -name "*.config.dart"
        ! -name "*.mocks.dart"
        ! -name "*.gr.dart"
        ! -name "*.gen.dart"
        ! -name "firebase_options*.dart"
        ! -name "*generated_plugin_registrant.dart"
        -exec dart format {} +
      description: Run dart format on all packages and apps in the workspace, excluding auto-generated files.
    format:check:
      exec: >-
        find .
        \( -path '*/.*' -o -path './build' -o -path './ios' -o -path './android' -o -path './windows' -o -path './macos' -o -path './linux' \) -prune
        -o -name "*.dart"
        ! -name "*.g.dart"
        ! -name "*.freezed.dart"
        ! -name "*.config.dart"
        ! -name "*.mocks.dart"
        ! -name "*.gr.dart"
        ! -name "*.gen.dart"
        ! -name "firebase_options*.dart"
        ! -name "*generated_plugin_registrant.dart"
        -exec dart format --set-exit-if-changed {} +
      description: Check dart format on all packages and apps in the workspace, excluding auto-generated files.
