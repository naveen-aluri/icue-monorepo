name: icueadmin
description: "A new Flutter project."
publish_to: "none"
homepage: https://icue.school
resolution: workspace
version: 1.0.9+10

environment:
  sdk: ^3.12.2

dependencies:
  app_settings: ^8.0.3
  appinio_swiper: ^2.1.1
  cached_network_image: ^3.4.1
  connectivity_plus: ^7.3.1
  cupertino_icons: ^1.0.9
  dio: ^5.11.0
  dotted_border: ^3.1.0
  file_picker: ^11.0.3
  firebase_analytics: ^12.4.5
  firebase_core: ^4.12.1
  firebase_crashlytics: ^5.2.6
  firebase_messaging: ^16.4.3
  firebase_performance: ^0.11.4+5
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  flutter_local_notifications: ^22.2.0
  get_it: ^9.2.1
  go_router: ^17.3.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image_picker: ^1.2.3
  in_app_update: ^5.0.0
  injectable: ^2.5.1
  intl: ^0.20.2
  lottie: ^3.5.1
  otp_autofill: ^4.1.0
  provider: ^6.1.5+1
  socket_io_client: ^1.0.2 # Do not update this package
  timelines_plus: ^2.0.0
  # icue_sdk:
  #   hosted:
  #     name: icue_sdk
  #     url: https://dart.cloudsmith.io/icue/icue-sdk/
  #   version: ^0.0.2
  collection: ^1.19.1
  icue_face_sdk:
    path: ../../packages/icue_face_sdk

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  injectable_generator: ^2.6.2
  lints: ^6.0.0
  msix: ^3.18.0

flutter:
  config:
    enable-swift-package-manager: false
  assets:
    - fonts/
    - assets/
    - assets/dashboard/
    - assets/animation/
  uses-material-design: true

  fonts:
    - family: Montserrat
      fonts:
        - asset: fonts/Montserrat-Regular.ttf
        - asset: fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: fonts/Montserrat-Bold.ttf
          weight: 700

msix_config:
  display_name: iCue Admin
  logo_path: "playstore.png"
  publisher_display_name: Thoughtniques
  identity_name: com.thoughtniques.icueadmin
  store: false # Set to true to deploy to Microsoft Store
  publisher: Thoughtniques
  msix_version: 1.0.0.0
  icons_background_color: "#ffffff"
  architecture: x64
  languages: en-us
  capabilities: internetClient
